name: Lean formal certification

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/lean-certification.yml'
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/lean-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Resolve pinned dependencies
        run: lake update

      - name: Reject admitted proofs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' GandalShy.lean GandalShy/; then
            echo 'Admitted proof token found.' >&2
            exit 1
          fi

      - name: Build formal certification
        run: lake build GandalShy
