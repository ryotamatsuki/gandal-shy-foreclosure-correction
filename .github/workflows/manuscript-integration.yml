name: Stage 14 submission QA

on:
  pull_request:
    paths:
      - "paper/**"
      - "submission/**"
      - "code/**"
      - "GandalShy/**"
      - "GandalShy.lean"
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "docs/JOURNAL_REQUIREMENTS_LEDGER.md"
      - "docs/STAGE_14_SUBMISSION_QA.md"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/manuscript-integration.yml"
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild frozen Lean proof-critical certificate
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: true
          build-args: GandalShy
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: false

      - name: Reject admitted Lean proofs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' GandalShy.lean GandalShy/; then
            echo 'Admitted proof token found.' >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Run symbolic and numerical verification
        run: make verify

      - name: Build manuscript and submission packages
        run: make all

      - name: Run Stage 14 submission-package audit
        run: python code/stage14_submission_audit.py

      - name: Enforce clean final LaTeX logs
        run: |
          if grep -E 'Overfull \\hbox|There were undefined references|There were undefined citations' paper/main.log; then
            echo 'Final manuscript log contains a blocking LaTeX warning.'
            exit 1
          fi
          if grep -E 'Overfull \\hbox|There were undefined references|There were undefined citations' output/international-economics-flat/main.log; then
            echo 'Flat-source manuscript log contains a blocking LaTeX warning.'
            exit 1
          fi
          if grep -E 'Overfull \\hbox|There were undefined references|There were undefined citations' submission/title_page.log; then
            echo 'Title-page log contains a blocking LaTeX warning.'
            exit 1
          fi

      - name: Check generated artifacts
        run: |
          test -s output/international-economics-manuscript.pdf
          test -s output/international-economics-submission-source.zip
          test -s output/reproducibility-supplement.zip
          test -s submission/title_page.pdf
          unzip -l output/international-economics-submission-source.zip
          unzip -l output/reproducibility-supplement.zip

      - name: Upload Stage 14 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage14-build
          path: |
            output/international-economics-manuscript.pdf
            output/international-economics-flat/main.pdf
            output/international-economics-submission-source.zip
            output/reproducibility-supplement.zip
            submission/title_page.pdf
